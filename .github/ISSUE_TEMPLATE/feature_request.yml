name: 功能建议
description: 建议新机构、新数据维度或更好用的交互方式
title: "[Idea] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 请先描述使用场景，而不只是功能名称。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      placeholder: 希望在哪个页面看到什么，以及如何操作。
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 对你的重要程度
      options:
        - 很重要，会经常使用
        - 有帮助，偶尔使用
        - 探索性想法
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: 参考产品或截图（可选）
